name: CI

# Runs the test suite and checks that the committed brand assets are in sync
# with make_assets.py. Everything here is stdlib-only, so it is fast and needs
# no secrets.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor: yt-dlp requires >=3.10.
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install aria2c (enables the segmented-download tests)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends aria2
          aria2c --version | head -1

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Run test suite without aria2c
        # The tool must degrade to a single connection, not fail, on machines
        # that do not have aria2c installed.
        run: |
          ARIA=$(command -v aria2c)
          sudo mv "$ARIA" /tmp/aria2c-hidden
          python -m unittest discover -s tests
          sudo mv /tmp/aria2c-hidden "$ARIA"

  assets:
    name: Brand assets complete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check every referenced asset exists and is valid
        # Deliberately does not regenerate and diff: PNG bytes vary with font
        # rendering and library versions, so that check fails for reasons
        # unrelated to correctness. Presence and validity are what matter.
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path

          assets = Path("assets")
          failures = []

          required = [
              "web/favicon.ico", "web/icon-192.png", "web/icon-512.png",
              "web/apple-touch-icon.png", "web/manifest.webmanifest",
              "web/sw.js", "social/og-image.png",
              "android/mipmap-xxxhdpi/ic_launcher.png",
              "ios/Icon-1024.png",
              "logo-horizontal.png", "icon-1024.png",
          ]
          for rel in required:
              p = assets / rel
              if not p.is_file():
                  failures.append(f"missing: {p}")
              elif p.stat().st_size == 0:
                  failures.append(f"empty: {p}")

          # The manifest must parse and every icon it advertises must exist.
          # Each check is guarded so one missing file reports cleanly instead
          # of aborting the whole script with a traceback.
          try:
              m = json.loads((assets / "web/manifest.webmanifest").read_text())
              for icon in m["icons"]:
                  p = assets / "web" / Path(icon["src"]).name
                  if not p.is_file():
                      failures.append(f"manifest icon missing: {p}")
          except Exception as exc:
              failures.append(f"manifest unreadable: {exc}")

          try:
              sw = (assets / "web/sw.js").read_text()
              if "addEventListener" not in sw:
                  failures.append("sw.js does not register any listener")
          except Exception as exc:
              failures.append(f"sw.js unreadable: {exc}")

          # PNG magic bytes, so a truncated or wrong-format file is caught.
          for p in assets.rglob("*.png"):
              if not p.read_bytes()[:8] == b"\x89PNG\r\n\x1a\n":
                  failures.append(f"not a PNG: {p}")

          if failures:
              print("\n".join(f"::error::{f}" for f in failures))
              sys.exit(1)
          print(f"All assets present and valid ({len(list(assets.rglob('*')))} files).")
          PY
